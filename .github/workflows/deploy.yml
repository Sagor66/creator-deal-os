name: Deploy

# main → staging automatically, after CI passes. Production then waits for a
# manual approval (the `production` GitHub Environment) and deploys the exact
# image digests staging tested. Design: docs/design/deployment.md §4.
# Operating it: docs/runbooks/deploy-and-rollback.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on main to deploy (blank = latest main). For redeploys and rollbacks."
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time, never cancelled halfway. A newer queued run replaces an
# older queued one, so the latest main wins.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    # Off until the one-time setup is done (repository variable DEPLOY_ENABLED=true).
    # workflow_run's branch filter matches the head branch *name*, which a fork's
    # PR can also call "main"; so require a successful push in this repository.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.web-url }}
    permissions:
      contents: read
      id-token: write # the OIDC token exchanged for short-lived Google credentials
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
      api-image: ${{ steps.images.outputs.api }}
      web-image: ${{ steps.images.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit to deploy (must be on main)
        id: commit
        env:
          # Untrusted input goes through env vars, never straight into the script.
          INPUT_REF: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ref="${RUN_SHA:-${INPUT_REF:-origin/main}}"
          sha="$(git rev-parse --verify --end-of-options "${ref}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; only main deploys"
            exit 1
          fi
          git checkout --quiet "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud (Workload Identity Federation, no stored keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once here; production reuses these exact digests.
      - name: Build and push the api image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/images/api:${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/images/web:${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Record the image digests
        id: images
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/images"
          echo "api=${registry}/api@${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "web=${registry}/web@${WEB_DIGEST}" >> "$GITHUB_OUTPUT"
          printf -- '- api: %s\n- web: %s\n' "$API_DIGEST" "$WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate, deploy and smoke-test staging
        id: deploy
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          APP_VERSION: ${{ steps.commit.outputs.version }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: infra/cloudrun/deploy.sh

  production:
    name: production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer on this environment = the manual approval. Only a job in
    # this environment can obtain production credentials (bootstrap.sh).
    environment:
      name: production
      url: ${{ steps.deploy.outputs.web-url }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.staging.outputs.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud (production identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote staging's digests into production's registry (no rebuild)
        id: images
        env:
          SHA: ${{ needs.staging.outputs.sha }}
          STAGING_API: ${{ needs.staging.outputs.api-image }}
          STAGING_WEB: ${{ needs.staging.outputs.web-image }}
        run: |
          gcloud auth print-access-token |
            skopeo login --username oauth2accesstoken --password-stdin "${REGION}-docker.pkg.dev"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/images"
          for app in api web; do
            if [[ "$app" == api ]]; then source="$STAGING_API"; else source="$STAGING_WEB"; fi
            digest="${source#*@}"
            target="${registry}/${app}:${SHA}"
            skopeo copy --preserve-digests "docker://${source}" "docker://${target}"
            copied="$(skopeo inspect --format '{{.Digest}}' "docker://${target}")"
            if [[ "$copied" != "$digest" ]]; then
              echo "::error::${app}: digest changed in transit ($digest → $copied)"
              exit 1
            fi
            echo "${app}=${registry}/${app}@${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Migrate, deploy and smoke-test production
        id: deploy
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          APP_VERSION: ${{ needs.staging.outputs.version }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: infra/cloudrun/deploy.sh
