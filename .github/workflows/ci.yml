name: CI

on:
  pull_request:
    # `edited` so fixing a PR title re-runs the title check (a re-run would reuse the old title).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Weekly re-check: new advisories and secret rules appear after code is merged.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Least privilege: every job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads every commit in the PR
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true # pnpm store, keyed on pnpm-lock.yaml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # pnpm/action-setup already caches the store

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Conventional Commits (commits and PR title)
        if: github.event_name == 'pull_request'
        env:
          # Untrusted input goes through env vars, never straight into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - run: pnpm format:check

      - run: pnpm check:boundaries

      - name: Lint, typecheck, test, build (Turborepo, cached)
        run: pnpm turbo run lint typecheck test build

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks a PR that adds or upgrades to a dependency with a known vulnerability.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Time-boxed exception. GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, stack exhaustion on deeply
          # nested glob patterns) has no patched release. It is reached only through dev tooling
          # (shadcn CLI, @next/eslint-plugin-next) running patterns we write; `audit --prod` is clean.
          # Remove when braces ships a fix. Review by 2026-11-04.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Everything that ships: production dependencies of every workspace.
      # Dev tooling advisories still show up in Dependabot alerts.
      - run: pnpm audit --prod --audit-level high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A PR scans only its own commits; main, the schedule and manual runs scan all history.
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --redact --no-banner --exit-code 1 .
          fi

  # Builds both deploy images and runs them the way Cloud Run will: the migrate
  # job, then the api (as the DML-only user), then web, then the deploy smoke
  # test. Catches Dockerfile, migration and wiring breaks before merge.
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway database on the runner; nothing real ever lives here.
          MYSQL_ROOT_PASSWORD: ci-throwaway-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-throwaway-root"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same cache scopes as the deploy workflow, so deploys reuse these layers.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cdo-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cdo-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Images run as a non-root user
        run: |
          for image in cdo-api:ci cdo-web:ci; do
            user="$(docker inspect --format '{{.Config.User}}' "$image")"
            if [[ -z "$user" || "$user" == root || "$user" == 0 ]]; then
              echo "::error::$image runs as '${user:-root}'"
              exit 1
            fi
            echo "$image runs as $user"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the least-privilege database users deployed environments use
        run: |
          docker run --rm --network host mysql:8.4 \
            mysql -h 127.0.0.1 -uroot -pci-throwaway-root -e "
              CREATE DATABASE creator_deal_os CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              CREATE USER 'cdo_migrator'@'%' IDENTIFIED BY 'ci-throwaway-migrator';
              GRANT ALL PRIVILEGES ON creator_deal_os.* TO 'cdo_migrator'@'%';
              CREATE USER 'cdo_app'@'%' IDENTIFIED BY 'ci-throwaway-app';
              GRANT SELECT, INSERT, UPDATE, DELETE ON creator_deal_os.* TO 'cdo_app'@'%';"

      - name: Run the migrate job (twice, to prove it is idempotent)
        run: |
          for attempt in first second; do
            echo "migrate: $attempt run"
            docker run --rm --network host -e APP_VERSION="$VERSION" -e DATABASE_TLS=off \
              -e DATABASE_URL=mysql://cdo_migrator:ci-throwaway-migrator@127.0.0.1:3306/creator_deal_os \
              cdo-api:ci dist/database/migrate.js
          done

      - name: Start api and web, then run the deploy smoke test against them
        run: |
          docker run -d --name api --network host -e PORT=8080 -e APP_VERSION="$VERSION" \
            -e DATABASE_TLS=off \
            -e DATABASE_URL=mysql://cdo_app:ci-throwaway-app@127.0.0.1:3306/creator_deal_os \
            cdo-api:ci
          docker run -d --name web --network host -e PORT=3000 -e API_URL=http://127.0.0.1:8080 cdo-web:ci
          scripts/smoke-test.sh http://127.0.0.1:3000 http://127.0.0.1:8080 "$VERSION"

      - name: The api shuts down gracefully on SIGTERM (exit 0)
        run: |
          docker stop --time 10 api
          code="$(docker inspect --format '{{.State.ExitCode}}' api)"
          docker logs api 2>&1 | grep -q '"msg":"shutdown complete"'
          [[ "$code" == 0 ]] || { echo "::error::api exited $code"; exit 1; }

      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
