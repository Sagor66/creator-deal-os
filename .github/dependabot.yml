version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # pnpm refuses packages younger than 24 h; waiting 3 days also skips most bad releases.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [infra]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [infra]

  # Base images in apps/*/Dockerfile are pinned by digest; this proposes bumps.
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: build
    labels: [infra]
