# Cloud Run service: api. Rendered and applied by infra/cloudrun/deploy.sh.
# ${...} placeholders are filled per environment; images are always pinned by digest.
# Design: docs/design/deployment.md §5.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    cloud.googleapis.com/location: "${REGION}"
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Free tier: scale to zero, and cap instances so nothing can run up a bill.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # CPU only while handling requests (request-based billing), boosted at start-up.
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: "api-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - name: api
          image: "${API_IMAGE}"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: APP_VERSION
              value: "${APP_VERSION}"
            - name: TRUST_PROXY
              value: "true"
            # Inside Cloud Run's 10 s between SIGTERM and SIGKILL.
            - name: SHUTDOWN_TIMEOUT_MS
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-database-url
                  key: latest
            - name: DATABASE_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: database-ca-cert
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # Readiness gates the release: a revision that can't reach MySQL never
          # becomes ready, the deploy fails, and the previous revision keeps serving.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          # Liveness never checks dependencies: a database outage must not restart healthy processes.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
